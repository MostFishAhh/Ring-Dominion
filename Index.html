<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring Dominion - Turn-Based Wrestling CCG</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg-dark: #0f1115;
    --panel-bg: #181c24;
    --panel-border: #2c3342;
    --accent-red: #e63946;
    --accent-gold: #f4a261;
    --accent-blue: #457b9d;
    --accent-green: #2a9d8f;
    --text-main: #f1faee;
    --text-muted: #8d99ae;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
  body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Header Bar */
  header { background: #08090c; border-bottom: 2px solid var(--panel-border); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .logo { font-size: 1.05rem; font-weight: 900; letter-spacing: 1px; color: var(--accent-gold); }
  .mode-bar { display: flex; gap: 6px; align-items: center; }
  .mode-btn { font-size: 0.75rem; padding: 5px 10px; border-radius: 6px; background: #181c24; border: 1px solid var(--panel-border); color: var(--text-muted); cursor: pointer; }
  .mode-btn.active { background: var(--accent-blue); color: #fff; border-color: #72a4c7; }
  .network-status { font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; background: #222; color: var(--text-muted); }
  .network-status.connected { background: #1b4332; color: #74c69d; }

  /* Main Arena Layout */
  #arena { flex: 1; display: grid; grid-template-columns: 1fr 340px; grid-template-rows: 1fr; height: calc(100vh - 50px); overflow: hidden; }
  #mat { display: flex; flex-direction: column; justify-content: space-between; padding: 10px 14px; border-right: 2px solid var(--panel-border); position: relative; overflow-y: auto; }

  /* Player Zones */
  .player-zone { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; transition: opacity 0.2s, border-color 0.2s; }
  .player-zone.active-turn { border-color: var(--accent-gold); box-shadow: 0 0 12px rgba(244, 162, 97, 0.12); }
  .player-zone.locked-zone { opacity: 0.75; }
  .zone-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .stat-group { display: flex; gap: 6px; align-items: center; }
  .stat-badge { font-weight: bold; font-size: 0.8rem; padding: 3px 8px; border-radius: 4px; background: #0d0f13; border: 1px solid var(--panel-border); }
  .hp-badge { color: var(--accent-red); border-color: rgba(230, 57, 70, 0.4); }
  .mom-badge { color: var(--accent-gold); border-color: rgba(244, 162, 97, 0.4); }
  .deck-badge { color: #a8dadc; font-size: 0.75rem; }
  .sub-badge { background: #5a189a; color: #fff; font-size: 0.72rem; padding: 2px 7px; border-radius: 4px; font-weight: bold; }

  /* Setup Zone / 5-Slot Bench */
  .bench-track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .bench-slot { height: 78px; background: #0c0e12; border: 1px dashed #3a4454; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--text-muted); position: relative; cursor: pointer; padding: 4px; text-align: center; transition: 0.15s; }
  .bench-slot.occupied { border: 1px solid var(--accent-blue); background: #141c2b; color: var(--text-main); }
  .bench-slot.opponent-card { background: #26171a; border: 1px solid var(--accent-red); color: #f4a261; cursor: default; }
  .bench-slot.disabled-click { cursor: not-allowed; }
  .bench-slot:hover:not(.disabled-click):not(.opponent-card) { border-color: var(--accent-gold); }
  .slot-label { position: absolute; top: 2px; left: 5px; font-size: 0.58rem; opacity: 0.55; }

  /* Hand Containers */
  .hand-container { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; min-height: 126px; align-items: center; }
  .hidden-hand-bar { display: flex; gap: 6px; align-items: center; justify-content: center; padding: 6px; background: #11141b; border-radius: 6px; font-size: 0.75rem; color: var(--text-muted); }
  .card-back-mini { width: 28px; height: 38px; border-radius: 4px; background: repeating-linear-gradient(45deg, #2b1d28, #2b1d28 4px, #3d2638 4px, #3d2638 8px); border: 1px solid var(--accent-red); }

  /* Cards */
  .card { width: 105px; height: 120px; border-radius: 6px; background: #202634; border: 1px solid #4a5568; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; cursor: pointer; font-size: 0.7rem; transition: transform 0.15s, border-color 0.15s; flex-shrink: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: left; }
  .card:hover:not(.disabled-card) { transform: translateY(-4px); border-color: var(--accent-gold); }
  .card.disabled-card { opacity: 0.55; cursor: not-allowed; }
  .card.strike { border-top: 3px solid #e76f51; }
  .card.impact { border-top: 3px solid #e63946; }
  .card.submission { border-top: 3px solid #9d4edd; }
  .card.utility { border-top: 3px solid #2a9d8f; }
  .card-cost { background: var(--accent-gold); color: #000; font-weight: 900; border-radius: 3px; padding: 1px 4px; font-size: 0.65rem; width: fit-content; }
  .card-name { font-weight: bold; line-height: 1.15; margin: 3px 0; font-size: 0.74rem; color: #fff; }
  .card-power { font-size: 0.65rem; color: #a8dadc; }
  .card-counter-hint { font-size: 0.58rem; color: #f4a261; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-tag { font-size: 0.55rem; background: #333d4f; color: #fff; padding: 1px 4px; border-radius: 3px; }

  /* Center Ring Canvas */
  #center-canvas { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; margin: 6px 0; position: relative; }
  .ring-ropes { width: 100%; height: 2px; background: repeating-linear-gradient(90deg, var(--accent-red), var(--accent-red) 12px, #fff 12px, #fff 24px, var(--accent-blue) 24px, var(--accent-blue) 36px); }
  .action-callout { font-size: 0.85rem; font-weight: bold; background: #11141c; padding: 6px 14px; border-radius: 16px; border: 1px solid var(--panel-border); color: var(--accent-gold); text-align: center; }

  /* 10s Bluff Progress Bar */
  #bluff-container { width: 85%; background: #222; border-radius: 10px; height: 12px; overflow: hidden; display: none; border: 1px solid #444; }
  #bluff-progress { width: 100%; height: 100%; background: var(--accent-red); transition: width 0.1s linear; }

  /* Right Sidebar & Combat Log */
  #sidebar { background: #0c0e12; display: flex; flex-direction: column; padding: 12px; gap: 10px; height: 100%; overflow: hidden; }
  .section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: bold; }
  #action-log { flex: 1; background: #11141b; border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px; overflow-y: auto; font-size: 0.74rem; line-height: 1.4; display: flex; flex-direction: column; gap: 5px; font-family: "Courier New", monospace; }
  .log-entry { border-bottom: 1px solid #1a1f29; padding-bottom: 3px; word-break: break-word; }
  .log-entry.play { color: #a8dadc; }
  .log-entry.counter { color: #f4a261; font-weight: bold; }
  .log-entry.damage { color: #ff6b6b; font-weight: bold; }
  .log-entry.system { color: #8d99ae; font-style: italic; }

  /* Buttons */
  .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { background: #1e2533; border: 1px solid #3d485c; color: var(--text-main); padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 0.78rem; cursor: pointer; transition: 0.15s; }
  button:hover:not(:disabled) { background: #2a3447; border-color: var(--accent-gold); }
  button:disabled { opacity: 0.38; cursor: not-allowed; }
  button.danger { background: #782a30; border-color: var(--accent-red); }
  button.danger:hover:not(:disabled) { background: #96343b; }
  button.success { background: #1f5f46; border-color: var(--accent-green); }
  button.success:hover:not(:disabled) { background: #287a5a; }

  /* Modals (Draw 2 Pick 1, Card Actions, Privacy Shield, PeerJS) */
  .modal-overlay { position: fixed; inset: 0; background: rgba(7, 9, 13, 0.92); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
  .modal-card { background: var(--panel-bg); border: 2px solid var(--panel-border); border-radius: 10px; padding: 20px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
  .draw-choices-row { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 8px 0; }
  .draw-card-large { width: 185px; min-height: 210px; background: #202634; border: 2px solid #4a5568; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; cursor: pointer; transition: 0.15s; }
  .draw-card-large:hover { border-color: var(--accent-gold); transform: translateY(-4px); }
  .slot-picker-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
  .code-display { font-size: 1.8rem; font-weight: 900; letter-spacing: 4px; color: var(--accent-gold); background: #0d0f14; padding: 10px; border-radius: 6px; border: 1px dashed var(--accent-gold); }
  input.room-input { background: #0d0f14; border: 1px solid var(--panel-border); color: #fff; padding: 10px; font-size: 1.1rem; text-align: center; border-radius: 6px; text-transform: uppercase; }
</style>
</head>
<body>

<header>
  <div class="logo">RING DOMINION ⚡ CCG</div>
  <div class="mode-bar">
    <button id="mode-ai" class="mode-btn active" onclick="switchGameMode('AI')">Solo vs AI</button>
    <button id="mode-pass" class="mode-btn" onclick="switchGameMode('PASS')">Pass & Play (2P)</button>
  </div>
  <div id="net-badge" class="network-status">Mode: Sparring AI</div>
</header>

<div id="arena">
  <!-- Main Ring Mat -->
  <div id="mat">
    <!-- Top Zone (Inactive / Opponent View) -->
    <div class="player-zone" id="top-zone">
      <div class="zone-meta">
        <div class="stat-group">
          <span id="top-name" style="font-weight: bold; font-size: 0.85rem;">Player 2 (AI)</span>
          <span id="top-sub-badge" class="sub-badge" style="display:none;">LOCKED IN HOLD</span>
        </div>
        <div class="stat-group">
          <span class="stat-badge deck-badge">Deck: <span id="top-deck-count">30</span></span>
          <span class="stat-badge hp-badge">HP: <span id="top-hp">100</span></span>
          <span class="stat-badge mom-badge">MOM: <span id="top-mom">1/1</span></span>
        </div>
      </div>
      <div class="hidden-hand-bar" id="top-hand-summary"></div>
      <div class="bench-track" id="top-bench"></div>
    </div>

    <!-- Center Ring Action & 10s Reaction Window -->
    <div id="center-canvas">
      <div class="ring-ropes"></div>
      <div id="ring-status" class="action-callout">Turn 1: Choose an action</div>
      <div id="bluff-container"><div id="bluff-progress"></div></div>
      <div id="counter-reaction-panel" style="display: none; gap: 8px; flex-wrap: wrap; justify-content: center;">
        <button id="btn-trigger-counter" class="danger">⚡ TRIGGER REVERSAL</button>
        <button id="btn-pass-counter">PASS (DO NOT COUNTER)</button>
      </div>
      <div id="sub-escape-panel" style="display: none; gap: 8px; flex-wrap: wrap; justify-content: center;">
        <button id="btn-mom-escape" class="success">Pay 3 MOM to Escape Hold</button>
        <button id="btn-roll-escape" class="danger">Roll Adrenaline Escape (d100 &le; HP)</button>
      </div>
      <div class="ring-ropes"></div>
    </div>

    <!-- Bottom Zone (Active Local Player View) -->
    <div class="player-zone active-turn" id="bottom-zone">
      <div class="bench-track" id="bottom-bench"></div>
      <div class="zone-meta" style="margin-top: 4px;">
        <div class="stat-group">
          <span id="bottom-name" style="font-weight: bold; font-size: 0.85rem;">Player 1 (Your Hand)</span>
          <span id="bottom-sub-badge" class="sub-badge" style="display:none;">TRAPPED IN HOLD</span>
        </div>
        <div class="stat-group">
          <span class="stat-badge deck-badge">Deck: <span id="bottom-deck-count">30</span></span>
          <span class="stat-badge hp-badge">HP: <span id="bottom-hp">100</span></span>
          <span class="stat-badge mom-badge">MOM: <span id="bottom-mom">1/1</span></span>
        </div>
      </div>
      <div class="hand-container" id="bottom-hand"></div>
    </div>
  </div>

  <!-- Right Sidebar Command & Action Log -->
  <div id="sidebar">
    <div class="section-title">Match Action Log</div>
    <div id="action-log"></div>

    <div class="section-title">Ring Controls</div>
    <div class="control-grid">
      <button id="btn-pin" class="danger" disabled>PIN OPPONENT</button>
      <button id="btn-end-turn" class="success">END TURN</button>
    </div>
    <div class="control-grid">
      <button id="btn-host">Host Online</button>
      <button id="btn-join">Join Online</button>
    </div>
  </div>
</div>

<!-- Universal Modal Container -->
<div id="modal" class="modal-overlay" style="display: none;">
  <div class="modal-card" id="modal-content"></div>
</div>

<script>
/* ==========================================================================
   1. PROCEDURAL SOUND FX ENGINE (Web Audio API)
   ========================================================================== */
class SoundEngine {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  cardPlay() {
    this.init();
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(420, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(130, this.ctx.currentTime + 0.11);
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.11);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.11);
  }
  impactHit() {
    this.init();
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(32, this.ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.25);
  }
  counterChime() {
    this.init();
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
    osc.frequency.setValueAtTime(880.00, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.35);
  }
  bell() {
    this.init();
    [800, 804].forEach(freq => {
      const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.1);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + 1.1);
    });
  }
}
const sfx = new SoundEngine();

/* ==========================================================================
   2. COMPLETE 18-CARD STARTER CATALOG
   ========================================================================== */
const CARD_DB = [
  { id: 1, name: "Knife Edge Chop", cat: "strike", cost: 1, dmg: 5, tick: 0, prop: "Quick", counters: [], desc: "Fast chest chop. Costs 1 MOM directly from hand." },
  { id: 2, name: "Dropkick", cat: "strike", cost: 2, dmg: 8, tick: 0, prop: "None", counters: ["Top-Rope Crossbody"], desc: "Counters Top-Rope Crossbody." },
  { id: 3, name: "Drop Toe Hold", cat: "strike", cost: 2, dmg: 4, tick: 0, prop: "None", counters: ["Running"], desc: "Counters any [Running] move." },
  { id: 4, name: "Discus Lariat", cat: "strike", cost: 4, dmg: 15, tick: 0, prop: "Running", counters: [], desc: "Heavy spinning lariat." },
  { id: 5, name: "Small Package", cat: "impact", cost: 2, dmg: 0, tick: 0, prop: "Flash Pin", counters: ["Snap Suplex", "Vertical Suplex", "Brainbuster", "Small Package", "Boston Crab"], desc: "Immediate pinfall. Counters suplexes & Crab." },
  { id: 6, name: "Snap Suplex", cat: "impact", cost: 3, dmg: 11, tick: 0, prop: "None", counters: ["Vertical Suplex", "Brainbuster"], desc: "Counters Vertical Suplex & Brainbuster." },
  { id: 7, name: "Back Body Drop", cat: "impact", cost: 3, dmg: 8, tick: 0, prop: "None", counters: ["Running", "Powerbomb"], desc: "Counters [Running] moves & Powerbomb." },
  { id: 8, name: "Body Slam", cat: "impact", cost: 4, dmg: 12, tick: 0, prop: "None", counters: ["Top-Rope Crossbody", "Aerial"], desc: "Counters Top-Rope Crossbody / [Aerial]." },
  { id: 9, name: "Hurricanrana", cat: "impact", cost: 5, dmg: 13, tick: 0, prop: "None", counters: ["Powerbomb"], desc: "Headscissor takedown. Counters Powerbomb." },
  { id: 10, name: "Top-Rope Crossbody", cat: "impact", cost: 5, dmg: 20, tick: 0, prop: "Aerial", counters: [], desc: "High-risk 20 DMG dive from the top rope." },
  { id: 11, name: "Powerbomb", cat: "impact", cost: 8, dmg: 25, tick: 0, prop: "None", counters: ["Hurricanrana"], desc: "Massive 25 DMG slam. Counters Hurricanrana." },
  { id: 12, name: "Boston Crab", cat: "submission", cost: 4, dmg: 8, tick: 8, prop: "None", counters: ["Dropkick"], desc: "8 DMG + 8 recurring tick at turn end. Counters Dropkick." },
  { id: 13, name: "Apply Torque", cat: "utility", cost: 2, dmg: 0, tick: 0, prop: "Torque", counters: [], desc: "+50% base tick damage on active submission." },
  { id: 14, name: "Feel the Crowd", cat: "utility", cost: 1, dmg: 0, tick: 0, prop: "None", counters: [], desc: "Gain +2 temporary Momentum on your next turn." },
  { id: 15, name: "Vertical Suplex", cat: "impact", cost: 5, dmg: 16, tick: 0, prop: "None", counters: [], desc: "Stalling showcase throw for 16 DMG." },
  { id: 16, name: "Brainbuster", cat: "impact", cost: 8, dmg: 22, tick: 0, prop: "None", counters: ["Vertical Suplex", "Snap Suplex"], desc: "22 DMG spike. Counters Vertical & Snap Suplex." },
  { id: 17, name: "Deny Counter", cat: "utility", cost: 2, dmg: 0, tick: 0, prop: "None", counters: [], desc: "Bench trap: spend 2 floating MOM to nullify a counter." },
  { id: 18, name: "Rope Break", cat: "utility", cost: 2, dmg: 0, tick: 0, prop: "Quick", counters: [], desc: "Play on your turn to immediately break a submission." }
];

/* ==========================================================================
   3. DECK BUILDER & GAME STATE
   ========================================================================== */
let G = {
  mode: "AI", // "AI", "PASS", "ONLINE"
  localRole: 1, // Used in ONLINE mode (1 = Host, 2 = Guest)
  turn: 1,
  activePlayer: 1,
  privacyLock: false,
  pendingDraw: null, // Holds [cardA, cardB] during start-of-turn draft
  pendingAttack: null, // Holds { card, attackerNum } during 10s bluff timer
  p1: null,
  p2: null
};

let bluffTimer = null;
let bluffTimeRemaining = 10;
let peer = null;
let conn = null;

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Builds a 36-card deck (2 copies of each of the 18 cards) and seeds a 1-cost card in the opening hand
function createPlayerState() {
  let fullDeck = [];
  CARD_DB.forEach(c => {
    fullDeck.push({ ...c });
    fullDeck.push({ ...c });
  });
  shuffleArray(fullDeck);

  // Rule: Guarantee at least one 1-Momentum card in opening hand
  const oneCostIdx = fullDeck.findIndex(c => c.cost === 1);
  const guaranteedCard = fullDeck.splice(oneCostIdx, 1)[0];
  const hand = [guaranteedCard];

  // Deal 4 remaining random cards for a 5-card opening hand
  for (let i = 0; i < 4; i++) {
    hand.push(fullDeck.pop());
  }

  return {
    hp: 100,
    mom: 1,
    maxMom: 1,
    bonusMom: 0,
    deck: fullDeck,
    hand: hand,
    bench: [null, null, null, null, null],
    submission: null,
    torque: 0,
    dealtDamageThisTurn: false
  };
}

function log(msg, type = "system") {
  const logEl = document.getElementById("action-log");
  const entry = document.createElement("div");
  entry.className = `log-entry ${type}`;
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  entry.innerText = `[${time}] ${msg}`;
  logEl.appendChild(entry);
  logEl.scrollTop = logEl.scrollHeight;
}

function switchGameMode(newMode) {
  clearInterval(bluffTimer);
  G.mode = newMode;
  document.getElementById("mode-ai").classList.toggle("active", newMode === "AI");
  document.getElementById("mode-pass").classList.toggle("active", newMode === "PASS");
  document.getElementById("net-badge").innerText = newMode === "AI" ? "Mode: Sparring AI" : "Mode: Pass & Play (2P)";
  initMatch();
}

function initMatch() {
  clearInterval(bluffTimer);
  document.getElementById("action-log").innerHTML = "";
  G.turn = 1;
  G.activePlayer = 1;
  G.privacyLock = false;
  G.pendingDraw = null;
  G.pendingAttack = null;
  G.p1 = createPlayerState();
  G.p2 = createPlayerState();

  // In AI mode, give AI one initial set trap for immediate testing fun
  if (G.mode === "AI") {
    G.p2.bench[0] = { ...CARD_DB[11], setThisTurn: false }; // Boston Crab
  }

  log(`Match started in ${G.mode === 'AI' ? 'Solo vs AI' : '2-Player Pass & Play'} mode!`, "system");
